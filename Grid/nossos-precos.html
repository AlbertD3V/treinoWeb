<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Nossos Preços | Barber City</title>
    <link rel="stylesheet" href="StalyGrid.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <main class="page-shell">

        <section class="site-frame content-page">
            <div class="price-wrap">
                <div class="price-card text-panel">
                    <div class="price-banner">
                        <h2>TABELA DE PREÇO DOS NOSSOS</h2>
                        <p>SERVIÇOS</p>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover mb-0 bootstrap-table">
                            <thead>
                                <tr>
                                    <th scope="col">Serviço</th>
                                    <th scope="col">Preço a partir de</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td>Corte</td><td>R$ 40,00</td></tr>
                                <tr><td>Escova</td><td>R$ 50,00</td></tr>
                                <tr><td>Coloração</td><td>R$ 70,00</td></tr>
                                <tr><td>Hidratação</td><td>R$ 40,00</td></tr>
                                <tr><td>Progressiva</td><td>R$ 170,00</td></tr>
                                <tr><td>Relaxamento</td><td>R$ 80,00</td></tr>
                                <tr><td>Escova + Chapinha</td><td>R$ 60,00</td></tr>
                                <tr><td>Luzes</td><td>R$ 100,00</td></tr>
                                <tr><td>Penteado</td><td>R$ 60,00</td></tr>
                                <tr><td>Maquiagem</td><td>R$ 60,00</td></tr>
                                <tr><td>Pé e mão</td><td>R$ 40,00</td></tr>
                                <tr><td>Pé ou mão (individual)</td><td>R$ 25,00</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="back-row">
                <a class="back-button" href="index.html">
                    <img src="btnVoltar.png" alt="Voltar para a página principal">
                </a>
            </div>
        </section>
    </main>
</body>
</html>
