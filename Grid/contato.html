<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Contato | Barber City</title>
    <link rel="stylesheet" href="StalyGrid.css">
</head>
<body>
    <main class="page-shell">

        <section class="site-frame content-page">
            <section class="contact-grid">
                <img class="feature-image" src="logo.png" alt="Imagem de contato Barber City">

                <div class="form-panel">
                    <div class="contact-info">
                        <h2>contato@barbercity.com.br</h2>
                        <p>Sh. Barra (71) 3034-0096</p>
                        <p>Sh. Salvador (71) 3342-8147</p>
                        <p>Sh. Lapa (71) 3328-1386</p>
                        <p>Sh. da Bahia (71) 3431-9692</p>
                    </div>

                    <form class="form-stack">
                        <input class="field" type="text" name="nome" placeholder="Nome *" required>
                        <input class="field" type="email" name="email" placeholder="Email *" required>
                        <input class="field" type="text" name="assunto" placeholder="Assunto">
                        <textarea class="field-textarea" name="mensagem" placeholder="Mensagem"></textarea>
                        <button class="primary-button" type="submit">Enviar</button>
                    </form>
                </div>
            </section>

            <div class="back-row">
                <a class="back-button" href="index.html">
                    <img src="btnVoltar.png" alt="Voltar para a página principal">
                </a>
            </div>
        </section>
    </main>
</body>
</html>
