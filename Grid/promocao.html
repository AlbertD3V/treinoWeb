<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Promoção | Barber City</title>
    <link rel="stylesheet" href="StalyGrid.css">
</head>
<body>
    <main class="page-shell">

        <section class="site-frame content-page">
            <div class="promo-layout">
                <img class="promo-brand" src="logo.png" alt="Logo Barber City">
                <h2 class="promo-subtitle">Adoro Promoção!</h2>
                <p class="promo-text">Receba as boas notícias primeiro</p>

                <form class="form-stack">
                    <input class="field" type="text" name="nome" placeholder="Nome" required>
                    <input class="field" type="tel" name="telefone" placeholder="Telefone" required>
                    <input class="field" type="email" name="email" placeholder="E-mail" required>

                    <label class="check-row">
                        <input type="checkbox" name="termos">
                        <span>Eu concordo em receber informações e ofertas</span>
                    </label>

                    <button class="primary-button" type="submit">Enviar</button>
                </form>
            </div>

            <div class="back-row">
                <a class="back-button" href="index.html">
                    <img src="btnVoltar.png" alt="Voltar para a página principal">
                </a>
            </div>
        </section>
    </main>
</body>
</html>
