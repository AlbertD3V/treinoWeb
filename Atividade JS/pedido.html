<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido | Supermercado Pegue e Pague</title>
    <link rel="stylesheet" href="StalyGridJS.css">
</head>
<body>
    <main class="container-geral pagina-pedido">
        <a href="index.html" class="voltar-inicio">Voltar para a Pagina 1</a>

        <section class="pedido-centro">
            <div class="painel-formulario">
                <h1 class="titulo-pedido-card">Pedido</h1>

                <form id="formPedido" class="formulario-pedido">
                    <div class="campo-formulario">
                        <label for="codigo">Codigo:</label>
                        <input type="text" id="codigo" autocomplete="off">
                    </div>

                    <div class="campo-formulario">
                        <label for="nomeProduto">Nome do Produto:</label>
                        <input type="text" id="nomeProduto" autocomplete="off">
                    </div>

                    <div class="campo-formulario">
                        <label for="quantidade">Quantidade:</label>
                        <input type="text" id="quantidade" inputmode="numeric" autocomplete="off">
                    </div>

                    <div class="campo-formulario">
                        <label for="precoUnitario">Preco Unitario:</label>
                        <input type="text" id="precoUnitario" inputmode="decimal" autocomplete="off">
                    </div>

                    <button type="submit" class="botao-adicionar">Adicionar</button>
                </form>
            </div>
        </section>

        <div class="acoes-listagem">
            <a href="#" id="btnListarPedido" class="link-listar">LISTAR PEDIDO</a>
        </div>

        <section id="secaoTabela" class="secao-tabela">
            <div class="tabela-responsiva">
                <table class="tabela-pedido">
                    <thead>
                        <tr>
                            <th>Codigo</th>
                            <th>Nome</th>
                            <th>Quantidade</th>
                            <th>Preco Unitario</th>
                            <th>Preco Total</th>
                            <th>Total da Compra</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
